name: Portfolio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portfolio.yml"
      - "README.md"
      - "docs/**"
      - "assets/projects/**"
      - "projects/**"
      - "portfolio/**"
  pull_request:
    paths:
      - ".github/workflows/portfolio.yml"
      - "README.md"
      - "docs/**"
      - "assets/projects/**"
      - "projects/**"
      - "portfolio/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy portfolio/dist to GitHub Pages after tests pass (main only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  NODE_VERSION: "24"
  SITE_URL: ${{ vars.SITE_URL || 'https://pauxru.github.io' }}
  SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH || '/Paul-Professional-Projects' }}

jobs:
  validate:
    name: Check, test, build and run e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: portfolio
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync and type-check
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build isolated custom-domain root variant
        env:
          SITE_URL: https://example.test
          SITE_BASE_PATH: /
        run: npm run build -- --outDir .root-build

      - name: Check custom-domain root routing and metadata
        env:
          SITE_URL: https://example.test
          SITE_BASE_PATH: /
          PORTFOLIO_TEST_OUT_DIR: .root-build
        run: npm run test:e2e -- --grep "every public page|resume download"

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: portfolio/dist

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: portfolio-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require main branch for production deployment
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Manual deployment is only allowed from the main branch."
          exit 1

      - name: Verify GitHub Pages is enabled for GitHub Actions
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/pages")" || {
              echo "::error::Could not read GitHub Pages configuration. Check the HTTP error above, repository permissions, and Settings > Pages. Pages must be enabled with Source set to GitHub Actions before deployment."
              exit 1
            }

          build_type="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_type",""))' <<<"${response}")"
          if [ "${build_type}" != "workflow" ]; then
            echo "::error::GitHub Pages must use GitHub Actions as its source. Open Settings > Pages and change Source to GitHub Actions before deploying."
            exit 1
          fi

      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@v6

      - name: Deploy artifact to GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        id: deployment
        uses: actions/deploy-pages@v5
