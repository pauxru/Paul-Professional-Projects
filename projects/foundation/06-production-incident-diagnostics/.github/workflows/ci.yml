name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ProductionIncidentDiagnostics.slnx
      - name: Build
        run: dotnet build ProductionIncidentDiagnostics.slnx -c Release --no-restore
      - name: Test
        run: dotnet test ProductionIncidentDiagnostics.slnx -c Release --no-build
