name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (.NET 10, Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ExampleBank.Ledger.slnx

      - name: Build (Release, no restore)
        run: dotnet build ExampleBank.Ledger.slnx -c Release --no-restore

      - name: Test (Release, no build)
        run: dotnet test ExampleBank.Ledger.slnx -c Release --no-build --verbosity normal
