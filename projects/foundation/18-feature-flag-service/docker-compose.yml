# UNVERIFIED: Docker is unavailable on the build host; this compose stack has not been started.
services:
  feature-flags:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5018:5018"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Issuer: FeatureFlags
      Jwt__Audience: FeatureFlags.Api
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set a non-development signing key in .env}
    volumes:
      - feature-flags-data:/data
volumes:
  feature-flags-data:
