name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore EnterpriseSearch.sln
      - name: Build
        run: dotnet build EnterpriseSearch.sln -c Release --no-restore
      - name: Test
        run: dotnet test EnterpriseSearch.sln -c Release --no-build --logger "console;verbosity=minimal"
