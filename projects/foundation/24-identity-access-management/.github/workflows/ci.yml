name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Northstar.Iga.sln
      - name: Build
        run: dotnet build Northstar.Iga.sln -c Release --no-restore
      - name: Test
        run: dotnet test Northstar.Iga.sln -c Release --no-build
