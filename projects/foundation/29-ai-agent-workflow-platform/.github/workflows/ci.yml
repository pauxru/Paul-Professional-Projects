name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AgentPlatform.slnx

      - name: Build (Release)
        run: dotnet build AgentPlatform.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test AgentPlatform.slnx -c Release --no-build --verbosity normal
